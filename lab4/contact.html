        <!-- Main Content Area -->
      <main class="main-content">
    <h3>Холбоо Барих</h3>
    <p>Бидэнтэй холбогдох эсвэл санал хүсэлтээ илгээх бол доорх формоор мэдээллээ явуулна уу.</p>
    
    <!-- Холбоо барих форм -->
    <form action="#" method="POST" style="margin-top: 20px;">
        <div style="margin-bottom: 15px;">
            <label for="name" style="display: block; margin-bottom: 5px; font-weight: bold;">Таны нэр:</label>
            <input type="text" id="name" name="name" placeholder="Нэрээ оруулна уу" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="email" style="display: block; margin-bottom: 5px; font-weight: bold;">Имэйл хаяг:</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="message" style="display: block; margin-bottom: 5px; font-weight: bold;">Зурвас:</label>
            <textarea id="message" name="message" rows="5" placeholder="Энд зурвасаа бичнэ үү..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" required></textarea>
        </div>

        <button type="submit" style="background-color: #2c3e50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Илгээх</button>
    </form>
</main>  
    </div>
